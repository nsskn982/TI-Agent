name: App (Flutter)

# check:   analyze + test on every change to app/
# web:     build the web app            -> deploy: GitHub Pages (main only); data comes from the
#          laptop's API through its Cloudflare Tunnel (repository variable API_URL)
# android: build a release APK          -> downloadable artifact "ti-agent-apk" on the run page
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

# Read-only by default; only the deploy job gets Pages permissions.
permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"   # pinned: a new stable can break packages (it did with 3.50 + font_awesome 10)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate platform folders (existing files are kept)
        run: flutter create --project-name ti_agent --org com.nsskn982 --platforms=web,android,ios .
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: |
          set +e
          flutter test --reporter json > test-results.jsonl
          code=$?
          # Failures become annotations on the run page (readable without the raw log).
          python3 tool/annotate_tests.py test-results.jsonl
          exit $code

  web:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create --project-name ti_agent --org com.nsskn982 --platforms=web .
      - run: flutter pub get
      - name: Write build config (public values only, the laptop API's https address)
        env:
          API_URL: ${{ vars.API_URL }}
          LINKEDIN_URL: ${{ vars.LINKEDIN_URL }}
        run: bash tool/write_config.sh
      - name: Build web
        run: |
          flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/" --dart-define-from-file=config.json
          rm config.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/build/web

  android:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"   # Android lint in Flutter 3.50's toolchain calls Java 21 APIs (List.removeLast)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create --project-name ti_agent --org com.nsskn982 --platforms=android .
      - run: flutter pub get
      - name: Write build config (public values only, the laptop API's https address)
        env:
          API_URL: ${{ vars.API_URL }}
          LINKEDIN_URL: ${{ vars.LINKEDIN_URL }}
        run: bash tool/write_config.sh
      - name: Build APK
        run: |
          set +e
          flutter build apk --release --dart-define-from-file=config.json 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          rm -f config.json
          if [ "$code" -ne 0 ]; then
            # Surface Gradle's "What went wrong" block as an annotation (readable without the raw log).
            python3 -c "import sys,re; t=open('build.log',encoding='utf-8',errors='replace').read(); i=t.find('What went wrong'); s=(t[i:i+3000] if i>=0 else t[-3000:]); print('::error title=APK build failed::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit "$code"
          fi
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ti-agent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ti-agent-apk
          path: app/build/app/outputs/flutter-apk/ti-agent.apk
          retention-days: 30

  deploy:
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
