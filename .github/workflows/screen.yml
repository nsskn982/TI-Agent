name: Weekly stock screen (S&P 500 + MidCap 400)

# Screens the S&P 500 + S&P MidCap 400 (~900 stocks: prices + SEC fundamentals), picks the top N by momentum among
# quality companies, and backfills news/filings for new picks. Runs Friday night after the
# US close and the daily ingest, so the Saturday agent run on the laptop sees fresh picks.
on:
  schedule:
    - cron: "30 23 * * 5"   # Fridays 23:30 UTC
  workflow_dispatch:
    inputs:
      top_n:
        description: "How many picks to select"
        default: "20"
      skip_refresh:
        description: "Re-screen stored data without downloading (true/false)"
        default: "false"

permissions:
  contents: read

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2

      - name: Screen
        env:
          INPUT_TOP_N: ${{ github.event.inputs.top_n || '20' }}
          INPUT_SKIP_REFRESH: ${{ github.event.inputs.skip_refresh || 'false' }}
        run: |
          [[ "$INPUT_TOP_N" =~ ^[0-9]{1,3}$ ]] || { echo "top_n must be a number"; exit 1; }
          extra=""
          if [ "$INPUT_SKIP_REFRESH" = "true" ]; then extra="--skip-refresh"; fi
          python -m orchestration.screen_run --top-n "$INPUT_TOP_N" $extra
