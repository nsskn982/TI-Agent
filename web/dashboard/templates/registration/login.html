{% extends "dashboard/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:32px auto">
  <h1>Sign in</h1>
  <p class="sub">TI Agent is invite-only. Ask the owner for an account.</p>
  {% if form.errors %}<p role="alert" style="color:var(--critical)">Username or password is incorrect.</p>{% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <p><label for="id_username">Username</label><br>
      <input id="id_username" name="username" autocomplete="username" required autofocus
        style="width:100%;padding:8px;border:1px solid var(--axis);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit"></p>
    <p><label for="id_password">Password</label><br>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required
        style="width:100%;padding:8px;border:1px solid var(--axis);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit"></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" style="width:100%;padding:9px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer">Sign in</button>
  </form>
</div>
{% endblock %}
