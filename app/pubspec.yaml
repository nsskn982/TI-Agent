name: ti_agent
description: TI Agent research app. Invite-only; reads the owner's laptop API (signed token, HTTPS tunnel).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  fl_chart: ^0.69.0
  url_launcher: ^6.3.0
  font_awesome_flutter: ^11.0.0   # 10.x extends IconData, which Flutter 3.50 made final
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
