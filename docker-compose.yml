# Local PostgreSQL 17 + pgvector for TI Agent.
#   docker compose up -d            start (data persists in the ti-agent-pgdata volume)
#   python -m common.db_init        create / upgrade the schema
# Listens on 127.0.0.1 only. Change POSTGRES_PASSWORD in .env and DATABASE_URL together.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ti-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ti_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ti_agent}
      POSTGRES_DB: ti_agent
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ti_agent -d ti_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    name: ti-agent-pgdata
